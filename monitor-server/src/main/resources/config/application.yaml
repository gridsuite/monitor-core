spring:
  application:
    name: monitor-server
  cloud:
    function:
      definition: consumeMonitorWorkerUpdate;consumeAutomaticExecution
    stream:
      bindings:
        publishRunSecurityAnalysis-out-0:
          destination: ${powsybl-ws.rabbitmq.destination.prefix:}monitor.process.securityanalysis.run
        publishRunLoadFlow-out-0:
          destination: ${powsybl-ws.rabbitmq.destination.prefix:}monitor.process.loadflow.run
        publishRunShortCircuit-out-0:
          destination: ${powsybl-ws.rabbitmq.destination.prefix:}monitor.process.shortcircuit.run
        publishMonitorUpdate-out-0:
          destination: ${powsybl-ws.rabbitmq.destination.prefix:}monitor.update
        publishProcessCancel-out-0:
          destination: ${powsybl-ws.rabbitmq.destination.prefix:}monitor.process.cancel
        publishAutomaticExecution-out-0:
          destination: ${powsybl-ws.rabbitmq.destination.prefix:}monitor.process.automatic-execution
        consumeMonitorWorkerUpdate-in-0:
          destination: ${powsybl-ws.rabbitmq.destination.prefix:}monitor.worker.update
          group: monitorWorkerUpdateGroup
        consumeAutomaticExecution-in-0:
          destination: ${powsybl-ws.rabbitmq.destination.prefix:}monitor.process.automatic-execution
          group: monitorAutomaticExecutionGroup
      output-bindings: publishRunSecurityAnalysis-out-0;publishRunLoadFlow-out-0;publishRunShortCircuit-out-0;publishMonitorUpdate-out-0;publishAutomaticExecution-out-0

monitor:
  automatic-execution:
    interval: PT30M
    case-uuid: 'f0d7fc6c-058d-4d77-b954-4b0f630eaa5b'

powsybl-ws:
  database:
    queryBegin: '&'
    customQuery: ${powsybl-ws.database.customQueryBegin}reWriteBatchedInserts=true
    name: monitor
