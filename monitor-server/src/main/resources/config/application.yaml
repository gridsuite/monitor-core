spring:
  application:
    name: monitor-server
  cloud:
    function:
      definition: consumeMonitorWorkerUpdate;consumeAutomaticExecution;consumeSecurityAnalysisRunDlq;consumeLoadFlowRunDlq;consumeShortCircuitRunDlq
    stream:
      bindings:
        publishRunSecurityAnalysis-out-0:
          destination: ${powsybl-ws.rabbitmq.destination.prefix:}monitor.process.securityanalysis.run
        publishRunLoadFlow-out-0:
          destination: ${powsybl-ws.rabbitmq.destination.prefix:}monitor.process.loadflow.run
        publishRunShortCircuit-out-0:
          destination: ${powsybl-ws.rabbitmq.destination.prefix:}monitor.process.shortcircuit.run
        publishMonitorUpdate-out-0:
          destination: ${powsybl-ws.rabbitmq.destination.prefix:}monitor.update
        publishProcessCancel-out-0:
          destination: ${powsybl-ws.rabbitmq.destination.prefix:}monitor.process.cancel
        publishAutomaticExecution-out-0:
          destination: ${powsybl-ws.rabbitmq.destination.prefix:}monitor.process.automatic-execution
        consumeMonitorWorkerUpdate-in-0:
          destination: ${powsybl-ws.rabbitmq.destination.prefix:}monitor.worker.update
          group: monitorWorkerUpdateGroup
        consumeAutomaticExecution-in-0:
          destination: ${powsybl-ws.rabbitmq.destination.prefix:}monitor.process.automatic-execution
          group: monitorAutomaticExecutionGroup
        consumeSecurityAnalysisRunDlq-in-0:
          destination: ${powsybl-ws.rabbitmq.destination.prefix:}monitor.process.securityanalysis.run.dlx
          group: ${powsybl-ws.rabbitmq.destination.prefix:}monitor.process.securityanalysis.run.dlx.dlq
          consumer:
            max-attempts: 3
        consumeLoadFlowRunDlq-in-0:
          destination: ${powsybl-ws.rabbitmq.destination.prefix:}monitor.process.loadflow.run.dlx
          group: ${powsybl-ws.rabbitmq.destination.prefix:}monitor.process.loadflow.run.dlx.dlq
          consumer:
            max-attempts: 3
        consumeShortCircuitRunDlq-in-0:
          destination: ${powsybl-ws.rabbitmq.destination.prefix:}monitor.process.shortcircuit.run.dlx
          group: ${powsybl-ws.rabbitmq.destination.prefix:}monitor.process.shortcircuit.run.dlx.dlq
          consumer:
            max-attempts: 3
      output-bindings: publishRunSecurityAnalysis-out-0;publishRunLoadFlow-out-0;publishRunShortCircuit-out-0;publishMonitorUpdate-out-0;publishAutomaticExecution-out-0
      rabbit:
        bindings:
          consumeSecurityAnalysisRunDlq-in-0:
            consumer: &dlqConsumer
              bind-queue: false
              declare-exchange: false
              queue-name-group-only: true
              auto-bind-dlq: true
              dead-letter-exchange-type: topic
              republish-to-dlq: true
              requeue-rejected: false
              dead-letter-exchange: ${powsybl-ws.rabbitmq.destination.prefix:}monitor.process.securityanalysis.run.dlx.parking
              dead-letter-queue-name: ${powsybl-ws.rabbitmq.destination.prefix:}monitor.process.securityanalysis.run.dlx.dlq.parking
          consumeLoadFlowRunDlq-in-0:
            consumer:
              <<: *dlqConsumer
              dead-letter-exchange: ${powsybl-ws.rabbitmq.destination.prefix:}monitor.process.loadflow.run.dlx.parking
              dead-letter-queue-name: ${powsybl-ws.rabbitmq.destination.prefix:}monitor.process.loadflow.run.dlx.dlq.parking
          consumeShortCircuitRunDlq-in-0:
            consumer:
              <<: *dlqConsumer
              dead-letter-exchange: ${powsybl-ws.rabbitmq.destination.prefix:}monitor.process.shortcircuit.run.dlx.parking
              dead-letter-queue-name: ${powsybl-ws.rabbitmq.destination.prefix:}monitor.process.shortcircuit.run.dlx.dlq.parking

monitor:
  automatic-execution:
    interval: PT30M
    case-uuid: 'f0d7fc6c-058d-4d77-b954-4b0f630eaa5b'

powsybl-ws:
  database:
    queryBegin: '&'
    customQuery: ${powsybl-ws.database.customQueryBegin}reWriteBatchedInserts=true
    name: monitor
