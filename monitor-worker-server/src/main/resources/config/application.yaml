spring:
  application:
    name: monitor-worker-server
  cloud:
    function:
      definition: consumeRun;consumeCancel
    stream:
      bindings:
        consumeRun-in-0:
          destination: ${powsybl-ws.rabbitmq.destination.prefix:}monitor.process.${worker.process}.run
          group: process${worker.process}RunGroup
          consumer:
            max-attempts: 1
        consumeCancel-in-0:
          destination: ${powsybl-ws.rabbitmq.destination.prefix:}monitor.process.cancel
        publishMonitorWorkerUpdate-out-0:
          destination: ${powsybl-ws.rabbitmq.destination.prefix:}monitor.worker.update
      output-bindings: publishMonitorWorkerUpdate-out-0
      rabbit:
        binder:
          consumeRun-in-0:
            consumer:
              auto-bind-dlq: true
              dead-letter-exchange: ${powsybl-ws.rabbitmq.destination.prefix:}${worker.process}.run.dlx
              dead-letter-queue-name: ${powsybl-ws.rabbitmq.destination.prefix:}${worker.process}.run.dlx.dlq
              dead-letter-exchange-type: topic
              quorum:
                enabled: true
                delivery-limit: 2

worker:
  execution-env-name: "default-env"
  process: securityanalysis

shortcircuit-analysis:
  default-provider: default-provider
